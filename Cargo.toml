[package]
name = "tubetape"
version = "0.1.0"
edition = "2024"
description = "Turn a YouTube channel's uploads into an announced mixtape (.opus/.ogg)"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["process", "io-util", "time", "fs", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
directories = "6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
